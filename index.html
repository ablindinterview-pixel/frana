<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Frana: unisci i video con l'effetto datamosh, direttamente sul telefono.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frana">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Frana</title>
<style>
  :root {
    --bg:#09090b; --panel:#131316; --line:#26262c; --fg:#f4f4f5; --mut:#8b8b95;
    --lime:#d6ff3f; --mag:#ff3df2; --cy:#3df0ff; --err:#ff6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100dvh; }
  main { max-width:520px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px 150px; }

  /* ---------- testata ---------- */
  .brand { display:flex; align-items:center; gap:14px; margin:6px 0 4px; }
  .mark { height:48px; width:auto; display:block; flex:none; }
  h1 { margin:0; font-size:44px; line-height:1; font-weight:900; letter-spacing:-.045em;
       text-shadow:2px 0 var(--mag), -2px 0 var(--cy); }
  h1 b { color:var(--lime); text-shadow:2px 0 var(--mag), -2px 0 var(--cy); }
  .tag { margin:10px 0 14px; color:var(--mut); font-size:15px; }
  .priv { font:12px var(--mono); color:var(--mut); margin:-4px 0 14px; }
  .priv i { color:var(--lime); font-style:normal; }
  #strip { display:flex; height:10px; gap:2px; margin-bottom:26px; overflow:hidden; }
  #strip span { height:100%; flex:none; }

  /* ---------- sezioni ---------- */
  .sec { font:600 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--mut);
         margin:0 0 10px; display:flex; align-items:center; gap:10px; }
  .sec i { color:var(--lime); font-style:normal; }
  .sec::after { content:""; flex:1; height:1px; background:var(--line); }
  section { margin-bottom:30px; }

  /* ---------- clip ---------- */
  .clip { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
          border-radius:14px; padding:10px; transition:border-color .6s; }
  .clip.fresh { border-color:var(--lime); }
  .thumb { width:60px; height:60px; border-radius:9px; flex:none; background:#1c1c21 center/cover;
           display:grid; place-items:center; font:700 18px var(--mono); color:var(--mut); position:relative; overflow:hidden; }
  .thumb em { position:absolute; left:4px; bottom:3px; font:700 11px var(--mono); font-style:normal;
              background:var(--bg); color:var(--lime); padding:1px 5px; border-radius:4px; }
  .meta { flex:1; min-width:0; }
  .meta .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px; }
  .meta .info { color:var(--mut); font:12px var(--mono); margin-top:2px; }
  .acts { display:flex; gap:4px; }
  .ib { width:40px; height:44px; display:grid; place-items:center; background:#1c1c21; border:1px solid var(--line);
        border-radius:10px; color:var(--fg); font-size:15px; cursor:pointer; padding:0; transition:transform .08s, background .15s; }
  .ib:active { transform:scale(.88); background:#2a2a31; }
  .ib:disabled { opacity:.28; }
  .join { display:flex; align-items:center; gap:8px; padding:7px 0 7px 24px; color:var(--mag); font:700 11px var(--mono); letter-spacing:.12em; }
  .join::before { content:""; width:2px; height:16px; background:repeating-linear-gradient(var(--mag) 0 3px, transparent 3px 6px); }
  .join s { display:inline-flex; gap:2px; text-decoration:none; }
  .join s u { width:6px; height:6px; background:var(--mag); display:block; }
  .join s u:nth-child(2) { opacity:.6 } .join s u:nth-child(3) { opacity:.3 }
  #add { width:100%; margin-top:10px; padding:16px; border:2px dashed #34343c; border-radius:14px; background:none;
         color:var(--fg); font:600 15px system-ui; cursor:pointer; transition:border-color .15s, background .15s, transform .08s; }
  #add:active { transform:scale(.98); }
  #add.over { border-color:var(--lime); background:rgba(214,255,63,.06); }
  #add small { display:block; margin-top:2px; color:var(--mut); font-weight:400; font-size:13px; }
  #sum { margin:12px 2px 0; color:var(--mut); font:12px var(--mono); min-height:18px; }
  #sum b { color:var(--lime); font-weight:700; }

  /* ---------- controlli ---------- */
  .ctl { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 14px; }
  .row { padding:13px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .lab { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; font-weight:600; }
  .lab output { font:600 13px var(--mono); color:var(--lime); }
  .help { margin:3px 0 0; color:var(--mut); font-size:13px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:none; margin:2px 0 0; touch-action:pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(90deg,var(--lime) var(--p,0%),#2c2c33 var(--p,0%)); }
  input[type=range]::-moz-range-track { height:6px; border-radius:3px; background:#2c2c33; }
  input[type=range]::-moz-range-progress { height:6px; border-radius:3px; background:var(--lime); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:7px; margin-top:-10px;
        background:var(--fg); border:3px solid var(--bg); box-shadow:0 0 0 2px var(--lime); transition:transform .1s; }
  input[type=range]:active::-webkit-slider-thumb { transform:scale(1.25); }
  input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:7px; background:var(--fg); border:3px solid var(--bg); box-shadow:0 0 0 2px var(--lime); }
  .seg { display:flex; gap:6px; margin-top:10px; }
  .seg label { flex:1; position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; }
  .seg span { display:flex; align-items:center; justify-content:center; gap:8px; min-height:46px; border-radius:10px;
              background:#1c1c21; border:1px solid var(--line); font:600 14px var(--mono); color:var(--mut); transition:transform .08s; }
  .seg input:active + span { transform:scale(.95); }
  .seg input:checked + span { background:var(--lime); border-color:var(--lime); color:#0b0b0d; }
  .seg input:focus-visible + span { outline:2px solid var(--cy); outline-offset:2px; }
  .seg + .help { margin-top:10px; }
  .seg.grid { display:grid; grid-template-columns:repeat(3, 1fr); }
  .seg.grid label { min-width:0; }
  .ar { border:2px solid currentColor; border-radius:2px; display:block; }
  .ar.v { width:11px; height:19px; } .ar.h { width:19px; height:11px; }

  /* ---------- barra fissa ---------- */
  #bar { position:fixed; left:0; right:0; bottom:0; padding:30px 16px calc(14px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent, var(--bg) 40%); pointer-events:none; }
  #bar > div { max-width:520px; margin:0 auto; pointer-events:auto; }
  #go { position:relative; overflow:hidden; width:100%; min-height:58px; border:0; border-radius:14px; background:var(--lime);
        color:#0b0b0d; font:800 17px system-ui; letter-spacing:.01em; cursor:pointer; transition:transform .08s, filter .15s; }
  #go:active:not(:disabled) { transform:scale(.97); }
  #go:disabled { background:#232329; color:var(--mut); cursor:default; }
  #go .fill { position:absolute; inset:0 auto 0 0; width:0; background:rgba(0,0,0,.22); transition:width .2s; }
  #go.busy { background:#2a3310; color:var(--lime); }
  #go.busy .fill { background:var(--lime); opacity:.35; }
  #go.work .fill { width:100% !important; background:repeating-linear-gradient(90deg, rgba(214,255,63,.4) 0 14px, transparent 14px 28px);
        background-size:56px 100%; animation:slide .7s linear infinite; opacity:1; }
  @keyframes slide { to { background-position:28px 0; } }
  #go span { position:relative; }
  #cancel { display:block; margin:6px auto 0; background:none; border:0; color:var(--mut); font:600 14px system-ui;
            padding:8px 14px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  #cancel[hidden] { display:none; }
  #msg { margin:8px 2px 0; text-align:center; font-size:13px; color:var(--mut); min-height:0; }
  #msg:empty { display:none; }
  #msg.err { color:var(--err); }

  /* ---------- risultato ---------- */
  #out[hidden] { display:none; }
  #frame { background:#000; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 auto; max-height:70dvh; }
  #frame.v { aspect-ratio:9/16; width:min(100%, calc(70dvh * 9 / 16)); }
  #frame.h { aspect-ratio:16/9; width:100%; }
  #vid { width:100%; height:100%; display:block; background:#000; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; min-height:50px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px;
         border:1px solid var(--line); background:var(--panel); color:var(--fg); font:700 15px system-ui; text-decoration:none; cursor:pointer; transition:transform .08s; }
  .btn:active { transform:scale(.96); }
  .btn.main, #share[hidden] ~ #dl { background:var(--fg); color:#0b0b0d; border-color:var(--fg); }

  /* ---------- animazioni (legate alle azioni dell'utente) ---------- */
  .join[hidden], .btn[hidden] { display:none; }
  .item.enter { animation:enter .34s cubic-bezier(.2,.9,.3,1) backwards; }
  @keyframes enter { from { opacity:0; transform:translateY(18px) scale(.96); } }
  .item.leaving { animation:leave .18s ease-in forwards; }
  @keyframes leave { to { opacity:0; transform:translateX(40px); } }
  .thumb .ph { display:block; }
  .thumb em { display:none; }
  .thumb.has .ph { display:none; }
  .thumb.has em { display:block; }
  .px { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .lab output { display:inline-block; transform-origin:right center; }
  .seg span { transition:background .15s, color .15s, border-color .15s, transform .08s; }
  .pop { animation:pop .28s cubic-bezier(.3,1.7,.5,1); }
  @keyframes pop { from { transform:scale(.88); } }
  #go { transition:background .2s, color .2s, transform .08s; }
  .working .thumb::after { content:""; position:absolute; inset:0; pointer-events:none;
        background:linear-gradient(transparent 38%, rgba(214,255,63,.55) 50%, transparent 62%); animation:scan 1.1s linear infinite; }
  .working .item:nth-child(2n) .thumb::after { animation-delay:-.55s; }
  .working .join s u { animation:blink .8s infinite; }
  .working .join s u:nth-child(2) { animation-delay:.15s; }
  .working .join s u:nth-child(3) { animation-delay:.3s; }
  @keyframes scan { from { transform:translateY(-100%); } to { transform:translateY(100%); } }
  @keyframes blink { 0%,100% { opacity:.2; } 50% { opacity:1; } }
  #out.rise { animation:rise .42s cubic-bezier(.2,.9,.3,1) backwards; }
  @keyframes rise { from { opacity:0; transform:translateY(30px); } }
  #frame.glitch { animation:glitch .56s linear .2s backwards; }
  @keyframes glitch {
    0%   { clip-path:inset(0 0 88% 0);  transform:translateX(-10px); filter:hue-rotate(70deg) saturate(2); }
    18%  { clip-path:inset(42% 0 28% 0); transform:translateX(12px); }
    36%  { clip-path:inset(8% 0 62% 0);  transform:translateX(-7px); filter:hue-rotate(-50deg) saturate(2); }
    54%  { clip-path:inset(68% 0 6% 0);  transform:translateX(6px); }
    72%  { clip-path:inset(0 0 0 0);     transform:translateX(-3px); filter:none; }
    100% { clip-path:inset(0);           transform:none; filter:none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img class="mark" src="assets/mark.svg" alt=""><h1>FRAN<b>A</b></h1></div>
    <p class="tag">Unisci i video: ogni transizione si scioglie nella successiva.</p>
    <p class="priv"><i>●</i> Tutto sul tuo telefono: nessun video viene caricato.</p>
    <div id="strip" aria-hidden="true"></div>
  </header>

  <section>
    <h2 class="sec"><i>01</i> Clip</h2>
    <div id="list"></div>
    <button id="add" type="button">+ Aggiungi video<small>Tocca per scegliere, o trascina qui</small></button>
    <input id="file" type="file" accept="video/*" multiple hidden>
    <p id="sum"></p>
  </section>

  <section>
    <h2 class="sec"><i>02</i> Effetto</h2>
    <div class="ctl">
      <div class="row">
        <div class="lab">Stile</div>
        <div class="seg grid" id="mode">
          <label><input type="radio" name="mode" value="bloom" checked><span>Bloom</span></label>
          <label><input type="radio" name="mode" value="melt"><span>Melt</span></label>
          <label><input type="radio" name="mode" value="pulse"><span>Pulse</span></label>
          <label><input type="radio" name="mode" value="shake"><span>Shake</span></label>
          <label><input type="radio" name="mode" value="corrupt"><span>Corrupt</span></label>
        </div>
        <p class="help" id="modeHelp"></p>
      </div>
      <div class="row">
        <div class="lab"><label for="bloom">Intensità</label><output id="bloomV"></output></div>
        <input id="bloom" type="range" min="0" max="60" value="12">
        <p class="help">A zero resta solo la rimozione del keyframe, senza altro.</p>
      </div>
      <div class="row">
        <div class="lab"><label for="seconds">Durata per clip</label><output id="secV"></output></div>
        <input id="seconds" type="range" min="1" max="15" value="5">
      </div>
      <div class="row">
        <div class="lab">Formato</div>
        <div class="seg" id="fmt">
          <label><input type="radio" name="format" value="vertical" checked><span><i class="ar v"></i>9:16</span></label>
          <label><input type="radio" name="format" value="horizontal"><span><i class="ar h"></i>16:9</span></label>
        </div>
      </div>
      <div class="row">
        <div class="lab">Qualità</div>
        <div class="seg" id="qual">
          <label><input type="radio" name="height" value="360"><span>360p</span></label>
          <label><input type="radio" name="height" value="480" checked><span>480p</span></label>
          <label><input type="radio" name="height" value="720"><span>720p</span></label>
        </div>
      </div>
    </div>
  </section>

  <section id="out" hidden>
    <h2 class="sec"><i>03</i> Risultato</h2>
    <div id="frame" class="v"><video id="vid" controls playsinline loop></video></div>
    <div class="btns">
      <button class="btn main" id="share" type="button" hidden>Condividi</button>
      <a class="btn" id="dl" href="#">Scarica</a>
      <button class="btn" id="again" type="button">Rifai</button>
    </div>
  </section>
</main>

<div id="bar"><div>
  <button id="go" type="button" disabled><i class="fill"></i><span>Aggiungi almeno 2 video</span></button>
  <button id="cancel" type="button" hidden>Annulla</button>
  <p id="msg" role="status" aria-live="polite"></p>
</div></div>

<script src="js/mosh.js"></script>
<script src="js/engine.js"></script>
<script>
const $ = id => document.getElementById(id);
const MAX = 10;
let items = [];            // {id, file, name, size, dur, thumb}
let busy = false;

/* ---------- animazioni: helper ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const anim = (el, kf, opt) => { if (!REDUCED && el.animate) el.animate(kf, opt); };
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
function setOut(el, t) {            // aggiorna un valore e lo fa "scattare" se cambia
  if (el.textContent === t) return;
  const first = el.textContent === ''; el.textContent = t;
  if (!first) anim(el, [{ transform: 'scale(1.35)' }, { transform: 'none' }], { duration: 170, easing: EASE });
}

/* ---------- striscia a blocchi (decorazione statica) ---------- */
(() => {
  const cols = ['#1c1c21', '#26262c', '#34343c', '#d6ff3f', '#ff3df2', '#3df0ff', '#1c1c21', '#26262c'];
  let w = 0, html = '';
  while (w < 560) { const s = 6 + Math.floor(Math.random() * 34); const c = cols[Math.floor(Math.random() * cols.length)];
    html += `<span style="width:${s}px;background:${c}"></span>`; w += s + 2; }
  $('strip').innerHTML = html;
})();

/* ---------- lista clip ---------- */
const fmtDur = s => s == null ? '…' : s < 60 ? s.toFixed(1) + ' s' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';

let nextId = 1;
const els = new Map();     // id clip -> elemento nella lista (i nodi si riusano: niente sfarfallii)
const rects = () => { const m = new Map(); els.forEach((el, id) => m.set(id, el.getBoundingClientRect().top)); return m; };

/* la miniatura si "de-pixela": da pochi blocchi grossi all'immagine nitida */
function reveal(th, url) {
  th.classList.add('has');
  if (REDUCED) { th.style.backgroundImage = `url(${url})`; return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 120; c.className = 'px'; th.prepend(c);
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const sizes = [3, 6, 11, 20, 40, 120]; let k = 0;
    const step = () => {
      const t = document.createElement('canvas'); t.width = t.height = sizes[k];
      t.getContext('2d').drawImage(img, 0, 0, sizes[k], sizes[k]);
      x.clearRect(0, 0, 120, 120); x.drawImage(t, 0, 0, 120, 120);
      if (++k < sizes.length) setTimeout(step, 80); else { th.style.backgroundImage = `url(${url})`; c.remove(); }
    };
    step();
  };
  img.src = url;
}

function make(it) {
  const el = document.createElement('div'); el.className = 'item enter';
  el.innerHTML = '<div class="join">MOSH <s><u></u><u></u><u></u></s></div>' +
    '<div class="clip fresh"><div class="thumb"><span class="ph"></span><em></em></div>' +
    '<div class="meta"><div class="name"></div><div class="info"></div></div><div class="acts"></div></div>';
  el.querySelector('.name').textContent = it.name;
  const acts = el.querySelector('.acts');
  const mk = (t, label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'ib';
    b.textContent = t; b.setAttribute('aria-label', label); b.onclick = fn; acts.append(b); };
  mk('↑', 'Sposta su', () => move(it, -1));
  mk('↓', 'Sposta giù', () => move(it, 1));
  mk('✕', 'Rimuovi', () => remove(it));
  setTimeout(() => el.querySelector('.clip').classList.remove('fresh'), 700);
  el.addEventListener('animationend', e => { if (e.animationName === 'enter') el.classList.remove('enter'); });
  return el;
}

function update(el, it, i) {
  el.querySelector('.join').hidden = i === 0;
  el.querySelector('.thumb .ph').textContent = i + 1;
  el.querySelector('.thumb em').textContent = i + 1;
  el.querySelector('.info').textContent = fmtDur(it.dur) + ' · ' + fmtSize(it.size);
  const [up, down, del] = el.querySelectorAll('.ib');
  up.disabled = busy || i === 0; down.disabled = busy || i === items.length - 1; del.disabled = busy;
  if (it.thumb && !el._shown) { el._shown = true; reveal(el.querySelector('.thumb'), it.thumb); }
}

function render(prev) {
  prev = prev || rects();                       // posizioni prima del cambiamento
  const list = $('list');
  items.forEach((it, i) => {
    let el = els.get(it.id);
    if (!el) { el = make(it); els.set(it.id, el); }
    if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);  // sposta solo se serve
    update(el, it, i);
  });
  els.forEach((el, id) => {                     // FLIP: gli elementi scivolano nella nuova posizione
    if (!prev.has(id)) return;
    const d = prev.get(id) - el.getBoundingClientRect().top;
    if (Math.abs(d) > 1) anim(el, [{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 300, easing: EASE });
  });
  $('add').hidden = items.length >= MAX;
  summary(); syncGo();
}

function move(it, dir) {
  const i = items.indexOf(it), j = i + dir;
  if (busy || j < 0 || j >= items.length) return;
  [items[i], items[j]] = [items[j], items[i]]; render();
}

function remove(it) {
  const el = els.get(it.id);
  if (busy || !el || el.classList.contains('leaving')) return;
  const finish = () => {
    const prev = rects();                       // posizioni mentre l'elemento c'è ancora
    el.remove(); els.delete(it.id); items.splice(items.indexOf(it), 1);
    render(prev);                               // gli altri scivolano a riempire il vuoto
  };
  if (REDUCED) return finish();
  el.classList.add('leaving'); setTimeout(finish, 180);
}

function summary() {
  const sec = +$('seconds').value;
  if (!items.length) { $('sum').textContent = ''; return; }
  const known = items.filter(x => x.dur != null);
  const total = known.reduce((a, x) => a + Math.min(x.dur, sec), 0);
  $('sum').innerHTML = `${items.length} clip · output stimato <b>≈ ${Math.round(total)} s</b>`;
}

function thumbFor(it) {
  const url = URL.createObjectURL(it.file), v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
  let finished = false;
  const done = () => {
    if (finished) return; finished = true;
    v.onloadedmetadata = v.onseeked = v.onerror = null;
    v.removeAttribute('src'); v.load();   // il video temporaneo non deve più leggere l'URL
    URL.revokeObjectURL(url); render();
  };
  v.onloadedmetadata = () => { it.dur = isFinite(v.duration) ? v.duration : null; try { v.currentTime = Math.min(0.1, (v.duration || 0) / 2); } catch (e) { done(); } };
  v.onseeked = () => { try { const c = document.createElement('canvas'); c.width = c.height = 120;
      const x = c.getContext('2d'), s = Math.min(v.videoWidth, v.videoHeight), sx = (v.videoWidth - s) / 2, sy = (v.videoHeight - s) / 2;
      x.drawImage(v, sx, sy, s, s, 0, 0, 120, 120); it.thumb = c.toDataURL('image/jpeg', .72); } catch (e) {} done(); };
  v.onerror = done;
}

function add(fileList) {
  for (const f of fileList) {
    if (items.length >= MAX) break;
    if (f.type && !f.type.startsWith('video/')) continue;
    const it = { id: nextId++, file: f, name: f.name, size: f.size, dur: null, thumb: null };
    items.push(it); thumbFor(it);
  }
  render();
}

$('add').onclick = () => $('file').click();
$('file').onchange = e => { add(e.target.files); e.target.value = ''; };
['dragover', 'dragenter'].forEach(t => $('add').addEventListener(t, e => { e.preventDefault(); $('add').classList.add('over'); }));
['dragleave', 'drop'].forEach(t => $('add').addEventListener(t, () => $('add').classList.remove('over')));
$('add').addEventListener('drop', e => { e.preventDefault(); add(e.dataTransfer.files); });

/* ---------- controlli ---------- */
const word = v => v === 0 ? 'solo mosh' : v < 10 ? 'leggera' : v < 25 ? 'media' : v < 42 ? 'forte' : 'estrema';
function paint(r) { r.style.setProperty('--p', ((r.value - r.min) / (r.max - r.min) * 100) + '%'); }
function sync() {
  setOut($('bloomV'), word(+$('bloom').value));
  setOut($('secV'), $('seconds').value + ' s');
  paint($('bloom')); paint($('seconds')); summary();
}
$('bloom').oninput = $('seconds').oninput = sync; sync();

const MODE_HELP = {
  bloom:   'Un movimento viene ripetuto e l\'immagine "fiorisce" oltre la transizione.',
  melt:    'Tutto il movimento viene rallentato e accumulato: l\'immagine cola lentamente.',
  pulse:   'Un gruppetto di frame gira in loop: l\'effetto pulsa a ritmo.',
  shake:   'I frame si mescolano in piccoli gruppi: tremolio caotico.',
  corrupt: 'Dati alterati a caso: blocchi colorati e macchie.'
};
function modeSync(first) {
  const p = $('modeHelp'); p.textContent = MODE_HELP[document.querySelector('input[name=mode]:checked').value];
  if (!first) anim(p, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: EASE });
}
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => modeSync()); modeSync(true);

/* piccolo "pop" sul selettore scelto */
document.querySelectorAll('.seg input').forEach(i => i.addEventListener('change', () => replay(i.nextElementSibling, 'pop')));

/* ---------- invio ---------- */
let wasReady = false;
function setLabel(t) {                           // l'etichetta scivola solo quando cambia davvero (non a ogni %)
  const sp = $('go').lastElementChild, key = t.replace(/\d+%/, '');
  sp.textContent = t;
  if (sp._key !== key) { sp._key = key; anim(sp, [{ opacity: 0, transform: 'translateY(9px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: EASE }); }
}
function syncGo() {
  const b = $('go');
  if (busy) return;
  const ready = items.length >= 2;
  b.disabled = !ready; b.className = '';
  b.firstElementChild.style.width = '0';
  setLabel(ready ? 'Crea effetto' : 'Aggiungi almeno 2 video');
  if (ready && !wasReady) anim(b, [{ transform: 'scale(.93)' }, { transform: 'scale(1.03)' }, { transform: 'none' }], { duration: 340, easing: EASE });
  wasReady = ready;
}
function state(label, cls, pct) {
  const b = $('go'); b.className = cls; setLabel(label);
  if (pct != null) b.firstElementChild.style.width = pct + '%';
}
function say(t, err) {
  $('msg').textContent = t || ''; $('msg').className = err ? 'err' : '';
  if (err) anim($('msg'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' },
                           { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }], { duration: 340 });
}

/* ---------- elaborazione: tutto nel browser ---------- */
let engine = null, cache = null, lastBlob = null, lastUrl = null, wake = null, cancelled = false;
const makeEngine = () => (window.__FRANA_ENGINE || WasmEngine.create)();

function friendly(e) {
  const m = String((e && e.message) || e);
  if (/File mancante|FFmpegWASM|Failed to fetch|NetworkError|importScripts|wasm/i.test(m))
    return 'Non riesco a caricare il motore video. Controlla la connessione e riprova.';
  return m;
}

async function run() {
  if (busy || items.length < 2) return;
  busy = true; cancelled = false; $('go').disabled = true; say('');
  $('out').hidden = true; $('vid').pause();   // il vecchio risultato esce di scena
  $('cancel').hidden = false;
  render();
  const fmt = document.querySelector('input[name=format]:checked').value;
  const q = +document.querySelector('input[name=height]:checked').value;
  const opts = {
    height: fmt === 'vertical' ? Math.floor(q * 16 / 9) : q,
    width: fmt === 'vertical' ? q : Math.floor(q * 16 / 9),
    fps: 30, seconds: +$('seconds').value, bloom: +$('bloom').value,
    mode: document.querySelector('input[name=mode]:checked').value,
    seed: crypto.getRandomValues(new Uint32Array(1))[0],
  };
  try {
    try { wake = await (navigator.wakeLock && navigator.wakeLock.request('screen')); } catch (e) { wake = null; }
    if (!engine) {
      state('Preparo il motore video…', 'busy work');
      say('La prima volta scarica circa 30 MB.');
      engine = await makeEngine();
      say('');
    }
    $('list').classList.add('working');
    const res = await Mosh.render(engine, items.map(i => i.file), opts, cache, s => {
      const pct = Math.min(99, Math.round((s.stage + s.frac) / s.total * 100));
      state(`${s.label} · ${pct}%`, 'busy', pct);
    });
    cache = res.cache;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastBlob = new Blob([res.mp4], { type: 'video/mp4' });
    lastUrl = URL.createObjectURL(lastBlob);
    $('frame').className = fmt === 'vertical' ? 'v' : 'h';
    $('vid').src = lastUrl; $('dl').href = lastUrl; $('dl').download = 'frana.mp4';
    $('out').hidden = false; replay($('out'), 'rise'); replay($('frame'), 'glitch');
    $('vid').play().catch(() => {});
    $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    if (!cancelled) { console.error(e); say(friendly(e), true); }
    if (engine) { engine.terminate(); engine = null; }   // dopo un errore si riparte da un motore pulito
  }
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  busy = false; $('cancel').hidden = true; $('list').classList.remove('working'); render();
}
$('go').onclick = run;
$('again').onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); run(); };
$('cancel').onclick = () => {
  cancelled = true; say('Annullato.');
  if (engine) { engine.terminate(); engine = null; }
};

/* ---------- condividi (solo dove il browser lo permette) ---------- */
(async () => {
  if (!navigator.canShare || !navigator.share) return;
  try { if (!navigator.canShare({ files: [new File([''], 'a.mp4', { type: 'video/mp4' })] })) return; } catch (e) { return; }
  $('share').hidden = false;
  $('share').onclick = async () => {
    try { await navigator.share({ files: [new File([lastBlob], 'frana.mp4', { type: 'video/mp4' })] }); } catch (e) {}
  };
})();

render();
</script>
</body>
</html>
